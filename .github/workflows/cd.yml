name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t shopsmart-client:latest ./client
        
      - name: Build Backend Docker Image
        run: docker build -t shopsmart-server:latest ./server

      - name: Deploy
        run: echo "Deployment steps go here"
